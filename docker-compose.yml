version: '3.8'

services:
  time-tracker:
    build: .
    container_name: time-tracker
    restart: unless-stopped
    ports:
      - "8880:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - TZ=America/New_York # Set your local timezone
    volumes:
      - time_tracker_data:/app/data
    depends_on:
      - gotify

  gotify:
    image: gotify/server:latest
    container_name: gotify
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      - GOTIFY_SERVER_PORT=80
      - TZ=America/New_York
    volumes:
      - gotify_data:/app/data

volumes:
  time_tracker_data:
    driver: local
  gotify_data:
    driver: local
