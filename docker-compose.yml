version: '3.8'

services:
  time-tracker:
    build: .
    image: time-tracker:latest
    container_name: time-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - TZ=America/New_York # Change to your local timezone
    volumes:
      - time_tracker_data:/app/data

volumes:
  time_tracker_data:
    driver: local
