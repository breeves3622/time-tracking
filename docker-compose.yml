version: '3.8'

services:
  time-tracker:
    build: .
    container_name: time-tracker
    restart: unless-stopped
    ports:
      - "8880:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - TZ=America/New_York # Set your local timezone
    volumes:
      - time_tracker_data:/app/data
    depends_on:
      - ntfy

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command:
      - serve
    restart: unless-stopped
    ports:
      - "8095:80"
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-https://ntfy.clanhanoi.net}
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=read-write
      - TZ=America/New_York
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_lib:/var/lib/ntfy

volumes:
  time_tracker_data:
    driver: local
  ntfy_cache:
    driver: local
  ntfy_lib:
    driver: local
